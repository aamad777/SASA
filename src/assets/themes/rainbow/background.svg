<!-- SARA_CARTOON_THEMES_V7 — original artwork, no copyrighted characters. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="rainbow-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c1740" />
      <stop offset="55%" stop-color="#3a2160" />
      <stop offset="100%" stop-color="#140a24" />
    </linearGradient>
  </defs>

  <style>
    .cloud-drift { animation: sara-cloud 10s ease-in-out infinite; transform-origin: center; }
    .cloud-drift.d2 { animation-delay: 2.5s; }
    .balloon { animation: sara-balloon 5s ease-in-out infinite; transform-origin: bottom center; }
    .balloon.d2 { animation-delay: 1s; }
    .balloon.d3 { animation-delay: 2s; }
    .twinkle { animation: sara-twinkle 3s ease-in-out infinite; transform-origin: center; }
    @keyframes sara-cloud {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(30px); }
    }
    @keyframes sara-balloon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }
    @keyframes sara-twinkle {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cloud-drift, .balloon, .twinkle { animation: none; }
    }
  </style>

  <rect width="1600" height="900" fill="url(#rainbow-sky)" />

  <!-- pastel rainbow arcs, corner anchored -->
  <g fill="none" stroke-linecap="round">
    <path d="M -60 420 A 420 420 0 0 1 780 0" stroke="#ff9ecf" stroke-width="26" opacity="0.55" />
    <path d="M -30 460 A 460 460 0 0 1 850 0" stroke="#ffd77a" stroke-width="26" opacity="0.5" />
    <path d="M 0 500 A 500 500 0 0 1 920 0" stroke="#8ee6d6" stroke-width="26" opacity="0.45" />
  </g>
  <g fill="none" stroke-linecap="round" transform="translate(1600,900) scale(-1,-1)">
    <path d="M -60 420 A 420 420 0 0 1 780 0" stroke="#b7a4ff" stroke-width="24" opacity="0.5" />
    <path d="M -30 460 A 460 460 0 0 1 850 0" stroke="#ff9ecf" stroke-width="24" opacity="0.45" />
  </g>

  <!-- fluffy clouds -->
  <g class="cloud-drift" fill="#ffffff" opacity="0.9" transform="translate(260,180)">
    <ellipse rx="60" ry="30" />
    <ellipse cx="46" cy="-10" rx="40" ry="26" />
    <ellipse cx="-46" cy="-6" rx="34" ry="22" />
  </g>
  <g class="cloud-drift d2" fill="#ffffff" opacity="0.85" transform="translate(1320,240)">
    <ellipse rx="52" ry="26" />
    <ellipse cx="40" cy="-8" rx="34" ry="22" />
    <ellipse cx="-40" cy="-6" rx="30" ry="20" />
  </g>

  <!-- twinkling stars -->
  <g fill="#fff6c9">
    <circle class="twinkle" cx="120" cy="90" r="4" />
    <circle class="twinkle" cx="900" cy="70" r="3.5" />
    <circle class="twinkle" cx="1480" cy="130" r="4" />
    <circle class="twinkle" cx="620" cy="130" r="3" />
  </g>

  <!-- balloons, floating up from the edges -->
  <g class="balloon" transform="translate(140,700)">
    <ellipse rx="34" ry="42" fill="#ff9ecf" />
    <path d="M0 42 L0 90" stroke="#e5e7eb" stroke-width="3" />
    <path d="M-6 12 Q0 20 6 12" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6" />
  </g>
  <g class="balloon d2" transform="translate(220,760)">
    <ellipse rx="26" ry="32" fill="#8ee6d6" />
    <path d="M0 32 L0 70" stroke="#e5e7eb" stroke-width="3" />
  </g>
  <g class="balloon d3" transform="translate(1440,720)">
    <ellipse rx="30" ry="38" fill="#ffd77a" />
    <path d="M0 38 L0 80" stroke="#e5e7eb" stroke-width="3" />
  </g>
  <g class="balloon" transform="translate(1500,660)">
    <ellipse rx="22" ry="28" fill="#b7a4ff" />
    <path d="M0 28 L0 62" stroke="#e5e7eb" stroke-width="3" />
  </g>

  <!-- little hearts -->
  <g fill="#ff9ecf" opacity="0.85" transform="translate(400,780) scale(0.6)">
    <path d="M0 -20 C -12 -36 -38 -28 -38 -8 C -38 8 0 30 0 30 C 0 30 38 8 38 -8 C 38 -28 12 -36 0 -20 Z" />
  </g>
  <g fill="#ffd1e6" opacity="0.7" transform="translate(1120,800) scale(0.4)">
    <path d="M0 -20 C -12 -36 -38 -28 -38 -8 C -38 8 0 30 0 30 C 0 30 38 8 38 -8 C 38 -28 12 -36 0 -20 Z" />
  </g>
</svg>
