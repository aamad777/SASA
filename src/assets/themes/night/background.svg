<!-- SARA_CARTOON_THEMES_V7 — original artwork, no copyrighted characters. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="night-sky" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#181c2c" />
      <stop offset="60%" stop-color="#11141f" />
      <stop offset="100%" stop-color="#060710" />
    </radialGradient>
  </defs>

  <style>
    .twinkle { animation: sara-twinkle 4s ease-in-out infinite; transform-origin: center; }
    .twinkle.d2 { animation-delay: 1.3s; }
    .twinkle.d3 { animation-delay: 2.6s; }
    .zzz { animation: sara-float-up 4.5s ease-in-out infinite; transform-origin: center; }
    .zzz.d2 { animation-delay: 1.5s; }
    .cloud-drift { animation: sara-cloud 12s ease-in-out infinite; transform-origin: center; }
    @keyframes sara-twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.95; }
    }
    @keyframes sara-float-up {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-40px); opacity: 0; }
    }
    @keyframes sara-cloud {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-24px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .twinkle, .zzz, .cloud-drift { animation: none; }
    }
  </style>

  <rect width="1600" height="900" fill="url(#night-sky)" />

  <!-- stars -->
  <g fill="#f2f3f7">
    <circle class="twinkle" cx="150" cy="120" r="3" />
    <circle class="twinkle d2" cx="260" cy="70" r="2.5" />
    <circle class="twinkle d3" cx="1420" cy="110" r="3" />
    <circle class="twinkle" cx="1520" cy="200" r="2.5" />
    <circle class="twinkle d2" cx="80" cy="260" r="2.5" />
    <circle class="twinkle d3" cx="1500" cy="60" r="2" />
    <circle class="twinkle" cx="700" cy="80" r="2" />
  </g>

  <!-- sleepy moon with closed, happy eyes -->
  <g transform="translate(1300,200)">
    <circle r="78" fill="#e7e6f5" />
    <circle cx="-20" cy="-16" r="6" fill="#c7c5df" opacity="0.6" />
    <circle cx="24" cy="10" r="5" fill="#c7c5df" opacity="0.5" />
    <path d="M -30 -6 Q -20 4 -10 -6" stroke="#403a5c" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 10 -6 Q 20 4 30 -6" stroke="#403a5c" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M -14 20 Q 0 30 14 20" stroke="#403a5c" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- floating zzz -->
  <g class="zzz" fill="#c7c5df" font-family="Georgia, serif" font-weight="700">
    <text x="1400" y="140" font-size="26">z</text>
  </g>
  <g class="zzz d2" fill="#c7c5df" font-family="Georgia, serif" font-weight="700">
    <text x="1430" y="110" font-size="18">z</text>
  </g>

  <!-- soft clouds -->
  <g class="cloud-drift" fill="#242840" opacity="0.8" transform="translate(220,330)">
    <ellipse rx="70" ry="34" />
    <ellipse cx="54" cy="-10" rx="46" ry="28" />
    <ellipse cx="-54" cy="-6" rx="40" ry="24" />
  </g>

  <!-- cozy little town skyline along the bottom -->
  <g fill="#171a29">
    <rect x="0" y="820" width="1600" height="80" />
  </g>
  <g fill="#1d2136">
    <rect x="60" y="740" width="70" height="90" />
    <polygon points="60,740 95,700 130,740" />
    <rect x="160" y="770" width="50" height="60" />
    <rect x="240" y="750" width="60" height="80" />
    <polygon points="240,750 270,715 300,750" />
    <rect x="1320" y="760" width="55" height="70" />
    <rect x="1400" y="735" width="70" height="95" />
    <polygon points="1400,735 1435,700 1470,735" />
    <rect x="1490" y="775" width="46" height="55" />
  </g>
  <g fill="#ffd77a" opacity="0.75">
    <rect x="78" y="760" width="14" height="14" />
    <rect x="100" y="760" width="14" height="14" />
    <rect x="256" y="775" width="12" height="12" />
    <rect x="1336" y="785" width="12" height="12" />
    <rect x="1420" y="760" width="12" height="12" />
  </g>
</svg>
