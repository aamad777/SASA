<!-- SARA_CARTOON_THEMES_V7 — original artwork, no copyrighted characters. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="jungle-sky" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#163a24" />
      <stop offset="60%" stop-color="#0f2a1a" />
      <stop offset="100%" stop-color="#07160e" />
    </radialGradient>
  </defs>

  <style>
    .butterfly { animation: sara-flutter 3.2s ease-in-out infinite; transform-origin: center; }
    .leaf-sway { animation: sara-sway 5s ease-in-out infinite; transform-origin: top center; }
    .leaf-sway.d2 { animation-delay: 1.1s; }
    @keyframes sara-flutter {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(-6deg); }
    }
    @keyframes sara-sway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .butterfly, .leaf-sway { animation: none; }
    }
  </style>

  <rect width="1600" height="900" fill="url(#jungle-sky)" />

  <!-- tree silhouettes, bottom corners, dark center kept clear -->
  <g fill="#0b2216">
    <rect x="20" y="500" width="46" height="400" rx="10" />
    <ellipse cx="43" cy="470" rx="150" ry="120" />
    <rect x="1500" y="480" width="46" height="420" rx="10" />
    <ellipse cx="1523" cy="440" rx="170" ry="140" />
  </g>
  <g fill="#153a24">
    <ellipse cx="70" cy="500" rx="120" ry="90" />
    <ellipse cx="1500" cy="470" rx="140" ry="100" />
  </g>

  <!-- leaf clusters framing edges -->
  <g class="leaf-sway" fill="#2f7a4a" transform="translate(150,120)">
    <path d="M0 0 C 40 -20 80 10 60 60 C 20 60 -20 40 0 0 Z" />
  </g>
  <g class="leaf-sway d2" fill="#3f9a5c" transform="translate(230,90) rotate(20)">
    <path d="M0 0 C 40 -20 80 10 60 60 C 20 60 -20 40 0 0 Z" />
  </g>
  <g class="leaf-sway" fill="#2f7a4a" transform="translate(1420,110) scale(-1,1)">
    <path d="M0 0 C 40 -20 80 10 60 60 C 20 60 -20 40 0 0 Z" />
  </g>
  <g class="leaf-sway d2" fill="#3f9a5c" transform="translate(1340,150) scale(-1,1) rotate(15)">
    <path d="M0 0 C 40 -20 80 10 60 60 C 20 60 -20 40 0 0 Z" />
  </g>

  <!-- simple original monkey silhouette on a branch -->
  <g transform="translate(220,660)">
    <rect x="-90" y="-8" width="180" height="14" rx="7" fill="#4a2f18" />
    <g fill="#8a5a34">
      <circle cx="0" cy="-46" r="40" />
      <circle cx="-34" cy="-70" r="16" />
      <circle cx="34" cy="-70" r="16" />
      <ellipse cx="0" cy="-30" rx="22" ry="18" fill="#c99a68" />
    </g>
    <circle cx="-12" cy="-50" r="4" fill="#2c1a0d" />
    <circle cx="12" cy="-50" r="4" fill="#2c1a0d" />
    <path d="M-10 -30 Q 0 -22 10 -30" stroke="#2c1a0d" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- parrot silhouette, opposite corner -->
  <g transform="translate(1360,620)">
    <ellipse cx="0" cy="0" rx="34" ry="44" fill="#ef6fb6" />
    <path d="M20 -10 C 60 -14 66 10 30 18 Z" fill="#5ee6d0" />
    <circle cx="-8" cy="-24" r="18" fill="#ffb454" />
    <circle cx="-14" cy="-26" r="4" fill="#2c1a0d" />
    <path d="M-28 -22 L-42 -16 L-28 -12 Z" fill="#ffd77a" />
  </g>

  <!-- fluttering butterfly -->
  <g class="butterfly" transform="translate(760,220)">
    <path d="M0 0 C -30 -34 -70 -20 -60 6 C -70 32 -30 40 0 8 Z" fill="#ffd77a" />
    <path d="M0 0 C 30 -34 70 -20 60 6 C 70 32 30 40 0 8 Z" fill="#ef6fb6" />
    <rect x="-3" y="-4" width="6" height="26" rx="3" fill="#2c1a0d" />
  </g>

  <!-- flowers along the ground -->
  <g fill="#ffd77a">
    <circle cx="480" cy="820" r="8" />
    <circle cx="500" cy="810" r="8" />
    <circle cx="500" cy="830" r="8" />
    <circle cx="520" cy="820" r="8" />
    <circle cx="500" cy="820" r="7" fill="#ef6fb6" />
  </g>
  <g fill="#5ee6d0">
    <circle cx="1080" cy="830" r="7" />
    <circle cx="1096" cy="822" r="7" />
    <circle cx="1096" cy="838" r="7" />
    <circle cx="1112" cy="830" r="7" />
    <circle cx="1096" cy="830" r="6" fill="#ffd77a" />
  </g>
</svg>
