<!-- SARA_CARTOON_THEMES_V7 — original artwork, no copyrighted characters. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="ocean-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#063142" />
      <stop offset="55%" stop-color="#0b4a63" />
      <stop offset="100%" stop-color="#02141c" />
    </linearGradient>
  </defs>

  <style>
    .bubble { animation: sara-rise 6s ease-in infinite; transform-origin: center; }
    .bubble.d2 { animation-delay: 1.4s; }
    .bubble.d3 { animation-delay: 2.8s; }
    .bubble.d4 { animation-delay: 4s; }
    .fish { animation: sara-bob 4.5s ease-in-out infinite; transform-origin: center; }
    .fish.d2 { animation-delay: 1.2s; }
    .sub { animation: sara-drift 9s ease-in-out infinite; transform-origin: center; }
    @keyframes sara-rise {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.85; }
      100% { transform: translateY(-260px); opacity: 0; }
    }
    @keyframes sara-bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    @keyframes sara-drift {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(24px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bubble, .fish, .sub { animation: none; }
    }
  </style>

  <rect width="1600" height="900" fill="url(#ocean-sky)" />

  <!-- gentle waves -->
  <g opacity="0.22" fill="none" stroke="#5ee6d0" stroke-width="4">
    <path d="M0 160 Q 60 140 120 160 T 240 160 T 360 160 T 480 160" />
    <path d="M1120 200 Q 1180 180 1240 200 T 1360 200 T 1480 200 T 1600 200" />
  </g>

  <!-- coral, bottom corners -->
  <g fill="#ef6fb6" opacity="0.85">
    <path d="M60 900 C 40 800 90 760 80 700 C 120 760 130 810 110 900 Z" />
    <path d="M150 900 C 140 830 175 800 170 750 C 205 800 210 850 195 900 Z" />
  </g>
  <g fill="#ffb454" opacity="0.85">
    <path d="M1500 900 C 1485 810 1530 780 1520 720 C 1560 780 1565 840 1545 900 Z" />
    <path d="M1420 900 C 1410 840 1440 815 1435 775 C 1465 815 1470 860 1455 900 Z" />
  </g>

  <!-- seafloor -->
  <path d="M0 900 L0 840 Q 400 800 800 830 T 1600 830 L1600 900 Z" fill="#083240" opacity="0.9" />

  <!-- cute fish -->
  <g class="fish" transform="translate(300,300)">
    <ellipse rx="46" ry="30" fill="#22c3e6" />
    <path d="M40 0 L74 -22 L74 22 Z" fill="#22c3e6" />
    <circle cx="16" cy="-6" r="6" fill="#ffffff" />
    <circle cx="18" cy="-6" r="3" fill="#0a2733" />
    <path d="M-6 10 Q 6 20 18 10" stroke="#0a2733" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <g class="fish d2" transform="translate(1240,220) scale(-1,1)">
    <ellipse rx="34" ry="22" fill="#ffb454" />
    <path d="M30 0 L56 -16 L56 16 Z" fill="#ffb454" />
    <circle cx="12" cy="-4" r="5" fill="#ffffff" />
    <circle cx="13" cy="-4" r="2.5" fill="#3a2a0c" />
    <path d="M-4 8 Q 4 15 12 8" stroke="#3a2a0c" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- smiling starfish -->
  <g transform="translate(1420,560)" fill="#ffd77a">
    <path d="M0 -46 L14 -14 L48 -12 L20 10 L30 44 L0 24 L-30 44 L-20 10 L-48 -12 L-14 -14 Z" />
    <circle cx="-10" cy="-2" r="4" fill="#5c3d12" />
    <circle cx="10" cy="-2" r="4" fill="#5c3d12" />
    <path d="M-8 10 Q 0 16 8 10" stroke="#5c3d12" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- tiny submarine -->
  <g class="sub" transform="translate(230,640)">
    <rect x="-60" y="-24" width="120" height="48" rx="24" fill="#5ee6d0" />
    <circle cx="10" cy="-2" r="14" fill="#ffffff" opacity="0.85" />
    <circle cx="10" cy="-2" r="14" fill="none" stroke="#0b4a63" stroke-width="3" />
    <rect x="-6" y="-46" width="6" height="22" fill="#5ee6d0" />
    <circle cx="-3" cy="-48" r="6" fill="#5ee6d0" />
    <path d="M56 -6 L78 -6 L70 -18 Z" fill="#5ee6d0" />
  </g>

  <!-- rising bubbles -->
  <g fill="#ffffff">
    <circle class="bubble" cx="520" cy="760" r="7" opacity="0.7" />
    <circle class="bubble d2" cx="560" cy="800" r="5" opacity="0.6" />
    <circle class="bubble d3" cx="900" cy="820" r="8" opacity="0.7" />
    <circle class="bubble d4" cx="940" cy="780" r="4" opacity="0.5" />
    <circle class="bubble d2" cx="1180" cy="760" r="6" opacity="0.65" />
  </g>
</svg>
