name: Build and Deploy SASA Image

on:
  push:
    branches:
      - latest-full-integration
    paths-ignore:
      - "k8s/sasa/deployment.yaml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sasa-image-build
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build image and update deployment
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: latest-full-integration
          fetch-depth: 0

      - name: Define image
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE=192.168.0.101:5050/sasa-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Verify private registry
        run: |
          curl --fail --silent --show-error \
            http://192.168.0.101:5050/v2/
          echo

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --tag "$IMAGE" \
            .

      - name: Scan Docker image
        run: |
          trivy image \
            --timeout 15m \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE"

      - name: Push Docker image
        run: docker push "$IMAGE"

      - name: Update Kubernetes image tag
        run: |
          sed -i \
            "s|image: 192.168.0.101:5050/sasa-frontend:.*|image: ${IMAGE}|" \
            k8s/sasa/deployment.yaml

          grep -n "image:" k8s/sasa/deployment.yaml

      - name: Commit deployment update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/sasa/deployment.yaml

          if git diff --cached --quiet; then
            echo "Deployment manifest is already current."
            exit 0
          fi

          git commit -m "Deploy SASA image ${GITHUB_SHA}"
          git push origin HEAD:latest-full-integration
