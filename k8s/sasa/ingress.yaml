apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sasa-frontend
  namespace: sasa
spec:
  ingressClassName: nginx
  rules:
    - host: sara.khader-ai.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sasa-frontend
                port:
                  name: http
