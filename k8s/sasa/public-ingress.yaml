apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saratube-public
  namespace: saratube
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 500m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: sara.khader-ai.online
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: saratube-backend
                port:
                  number: 4000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: saratube-backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sasa-frontend-bridge
                port:
                  number: 80
